<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9333EA">
    <title>Offline - Fasting Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 28rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .icon-container {
            width: 6rem;
            height: 6rem;
            margin: 0 auto 1.5rem;
            background: #9333EA;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-container img {
            width: 4rem;
            height: 4rem;
        }
        
        h1 {
            color: #1f2937;
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        
        p {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        
        .features {
            background: #f9fafb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .features h2 {
            color: #374151;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .features ul {
            list-style: none;
        }
        
        .features li {
            color: #6b7280;
            font-size: 0.875rem;
            padding: 0.25rem 0;
            padding-left: 1.5rem;
            position: relative;
        }
        
        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: bold;
        }
        
        .retry-button {
            background: #9333EA;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        
        .retry-button:hover {
            background: #7e22ce;
        }
        
        .retry-button:active {
            transform: scale(0.98);
        }
        
        .status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <img src="/icons/icon-192x192.png" alt="Fasting Tracker">
        </div>
        
        <h1>You're Offline</h1>
        
        <p>
            No internet connection detected. Don't worry - your previously loaded entries are still accessible.
        </p>
        
        <div class="features">
            <h2>Available Offline</h2>
            <ul>
                <li>View cached fasting entries</li>
                <li>Create new entries (will sync later)</li>
                <li>Access your fasting statistics</li>
                <li>View app settings</li>
            </ul>
        </div>
        
        <button class="retry-button" onclick="location.reload()">
            Retry Connection
        </button>
        
        <div class="status" id="status">
            Waiting for connection...
        </div>
    </div>
    
    <script>
        // Auto-reload when connection is restored
        window.addEventListener('online', function() {
            document.getElementById('status').textContent = 'Connection restored! Reloading...';
            setTimeout(function() {
                location.reload();
            }, 1000);
        });
        
        // Update status
        if (navigator.onLine) {
            document.getElementById('status').textContent = 'Connection available - click retry';
        }
    </script>
</body>
</html>
